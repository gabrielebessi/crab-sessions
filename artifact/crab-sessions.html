<title>Dashboard sessioni attive - 🦀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: a tide-pool board. Sessions grouped by what they need from you, the ones that
   wait on an answer first; opening one keeps the others in a rail on the left. */
:root {
  --bg: #e8eef1;
  --surface: #fbfdfd;
  --surface-2: #dbe5ea;
  --ink: #13232b;
  --muted: #526670;
  --line: #c4d2d8;
  --coral: #c4562f;
  --coral-ink: #ffffff;
  --work: #11796a;
  --work-bg: #d8f0ea;
  --ask: #a8640a;
  --ask-bg: #fbecd2;
  --wait: #5f727b;
  --wait-bg: #e1e9ec;
  --danger: #b0302c;
  --danger-bg: #f8e0de;
  --add-bg: #dcf3e3;
  --add-strong: #b4e6c3;
  --del-bg: #fbe3e1;
  --del-strong: #f3bcb7;
  --hunk-bg: #e2ecf7;
  --lane0: #c4562f; --lane1: #11796a; --lane2: #3f63c4; --lane3: #a8640a; --lane4: #8a46b0; --lane5: #2f8fa8;
  --shadow: 0 1px 0 rgba(19, 35, 43, .06), 0 6px 18px -12px rgba(19, 35, 43, .35);
  --display: "Pixelify Sans", ui-monospace, "SF Mono", Menlo, monospace;
  /* numbers: Pixelify's 3, 5 and 8 look alike at this size */
  --digits: "VT323", ui-monospace, "SF Mono", Menlo, monospace;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d171c; --surface: #14222a; --surface-2: #1b2e36; --ink: #e1ebee; --muted: #8ea2ab; --line: #29404a;
    --coral: #e8845e; --coral-ink: #1b0d07; --work: #3cc2a6; --work-bg: #10322c; --ask: #efb44a; --ask-bg: #392a0f;
    --wait: #8b9ea7; --wait-bg: #1d2c33; --danger: #f17b74; --danger-bg: #3a1716;
    --add-bg: #12301f; --add-strong: #1d5233; --del-bg: #3a1819; --del-strong: #622a2a; --hunk-bg: #1a2b3f;
    --lane0: #e8845e; --lane1: #3cc2a6; --lane2: #7f9cf0; --lane3: #efb44a; --lane4: #c18ae0; --lane5: #5cc4dc;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -14px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d171c; --surface: #14222a; --surface-2: #1b2e36; --ink: #e1ebee; --muted: #8ea2ab; --line: #29404a;
  --coral: #e8845e; --coral-ink: #1b0d07; --work: #3cc2a6; --work-bg: #10322c; --ask: #efb44a; --ask-bg: #392a0f;
  --wait: #8b9ea7; --wait-bg: #1d2c33; --danger: #f17b74; --danger-bg: #3a1716;
  --add-bg: #12301f; --add-strong: #1d5233; --del-bg: #3a1819; --del-strong: #622a2a; --hunk-bg: #1a2b3f;
  --lane0: #e8845e; --lane1: #3cc2a6; --lane2: #7f9cf0; --lane3: #efb44a; --lane4: #c18ae0; --lane5: #5cc4dc;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -14px rgba(0, 0, 0, .9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 18px; }
.board { display: grid; gap: 18px; min-width: 0; }

/* ---------- top */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; border: 0; background: none; padding: 0; cursor: pointer; }
.brand img { width: 52px; height: 40px; image-rendering: pixelated; }
h1 { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .5px; margin: 0; line-height: 1; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.live .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--wait); flex: none; }
.live[data-state="live"] .dot { background: var(--work); animation: pulse 2.4s infinite; }
.live[data-state="retrying"] .dot { background: var(--ask); }
.live[data-state="offline"] .dot, .live[data-state="denied"] .dot { background: var(--danger); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--work) 55%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ---------- summary */
/* stays in view while the board scrolls; a tighter version once it sticks */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 8px; margin-block: -8px; }
.summary.stuck { box-shadow: 0 10px 12px -12px rgba(19, 35, 43, .45); }
.summary.stuck .tile { padding: 8px 12px; gap: 4px; }
.summary.stuck .tile .big, .summary.stuck .counts b { font-size: 24px; }
.summary.stuck .meter { height: 6px; }
#summary-edge { height: 1px; margin-bottom: -19px; }
.tile .big small { font-family: var(--body); font-size: 13px; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
@media (max-width: 1100px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tile .big { font-family: var(--digits); font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }
.sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
.counts b { font-family: var(--digits); font-size: 32px; font-weight: 400; line-height: .9; margin-right: 4px; }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--work); }
.meter i.warn { background: var(--ask); }
.meter i.crit { background: var(--danger); }

/* ---------- notice */
.notice { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ask); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.notice.bad { border-left-color: var(--danger); }
.notice h2 { margin: 0; font-size: 15px; }
.notice p { margin: 0; color: var(--muted); max-width: 70ch; }
.notice pre { margin: 0; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 12px; user-select: all; }
.notice .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- groups and cards */
.group { display: grid; gap: 10px; }
.group-head { display: flex; align-items: baseline; gap: 10px; }
.group-head h2 { font-family: var(--display); font-weight: 500; font-size: 17px; margin: 0; letter-spacing: .3px; }
.group-head .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; align-items: stretch; }

.s-working { --state-c: var(--work); --state-bg: var(--work-bg); }
.s-asking, .s-approval { --state-c: var(--ask); --state-bg: var(--ask-bg); }
.s-waiting { --state-c: var(--wait); --state-bg: var(--wait-bg); }
.s-idle { --state-c: var(--muted); --state-bg: var(--wait-bg); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: grid; gap: 10px; padding: 12px; min-width: 0; position: relative; }
.card::before { content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 4px; border-radius: 0 4px 4px 0; background: var(--state-c, var(--wait)); }
.card.s-asking, .card.s-approval { border-color: color-mix(in srgb, var(--ask) 45%, var(--line)); }
.card.s-idle::before { background: var(--line); }
.card.is-example { opacity: .78; }
/* cards of a row stretch to the tallest one, the buttons sit at the bottom; the agent list
   opens in a popover, so a card never grows with it */
.grid > .card { display: flex; flex-direction: column; gap: 10px; }
.card-body { display: grid; gap: 8px; }
.card-body:empty { display: none; }
.card .actions { margin-top: auto; }
.card .title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .agents-bar .link[aria-expanded="true"] { background: var(--surface-2); }

.agent-pop { position: fixed; z-index: 20; width: min(380px, calc(100vw - 32px)); max-height: min(70vh, 520px); overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 48px -16px rgba(0, 0, 0, .55); padding: 10px; display: grid; gap: 4px; }
.agent-pop header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; align-items: start; padding: 2px 4px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; position: sticky; top: -10px; background: var(--surface); z-index: 1; padding-top: 10px; margin-top: -10px; }
.agent-pop h3 { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
.agent-pop header .sub { grid-column: 1; }
.agent-pop .close { grid-row: 1 / 3; grid-column: 2; border: 0; background: none; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.agent-pop .close:hover { background: var(--surface-2); color: var(--ink); }

.head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; }
.crab { border: 0; padding: 4px; background: var(--state-bg, var(--surface-2)); border-radius: 10px; cursor: pointer; line-height: 0; }
.crab img { width: 66px; height: 51px; image-rendering: pixelated; display: block; }
.crab:disabled { cursor: default; }
.who { display: grid; gap: 2px; min-width: 0; }
.title { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; font-size: 15px; line-height: 1.25; cursor: pointer; overflow-wrap: anywhere; }
.title:hover:not(:disabled) { color: var(--coral); }
.title:disabled { cursor: default; }
.meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; min-width: 0; }
.meta span { overflow-wrap: anywhere; }
.pill { justify-self: start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--state-c); background: var(--state-bg); border-radius: 999px; padding: 2px 9px; font-variant-numeric: tabular-nums; }
.badge { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.numbers { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* the crab says it has finished, until the session starts again or falls asleep */
.bubble { position: relative; align-self: flex-start; max-width: 100%; margin: -2px 0 0; font-family: var(--display); font-weight: 500; font-size: 14px; line-height: 1.2; color: var(--ink); background: var(--surface); border: 2px solid var(--ink); border-radius: 10px; padding: 6px 11px; box-shadow: 3px 3px 0 color-mix(in srgb, var(--ink) 16%, transparent); overflow-wrap: anywhere; transform-origin: 30px 0; }
.bubble.pop { animation: bubble-pop .36s steps(4, end) both; }
.bubble::before, .bubble::after { content: ""; position: absolute; left: 22px; border-style: solid; border-color: transparent; }
.bubble::before { bottom: 100%; border-width: 0 7px 9px 7px; border-bottom-color: var(--ink); }
.bubble::after { bottom: calc(100% - 3px); left: 25px; border-width: 0 4px 6px 4px; border-bottom-color: var(--surface); }
@keyframes bubble-pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

.agents { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 6px; }
.agents-bar { display: flex; align-items: center; gap: 8px; min-width: 0; }
.swim { display: flex; align-items: center; flex: none; }
.swim img { width: 30px; height: 23px; image-rendering: pixelated; }
.agents-bar .txt { font-size: 12px; color: var(--muted); flex: 1; min-width: 0; }
.link { border: 0; background: none; padding: 2px 4px; color: var(--coral); font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 4px; flex: none; }
.agent { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; width: 100%; border: 0; background: none; text-align: left; padding: 6px; border-radius: 8px; cursor: pointer; }
.agent:hover { background: var(--surface-2); }
.agent .d { width: 8px; height: 8px; border-radius: 50%; background: var(--line); align-self: center; }
.agent.on .d { background: var(--work); }
.agent .name { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.agent .name small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.agent .when { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.agent .step { grid-column: 2 / 4; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tool { font-family: var(--mono); font-size: 11px; color: var(--ink); background: var(--surface-2); border-radius: 4px; padding: 0 5px; margin-right: 6px; white-space: nowrap; display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }

.status { font-size: 12px; border-radius: 8px; padding: 6px 9px; background: var(--surface-2); color: var(--ink); overflow-wrap: anywhere; }
.status.ok { background: var(--work-bg); }
.status.bad { background: var(--danger-bg); }

.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 11px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.px { width: 24px; height: 24px; flex: none; shape-rendering: crispEdges; fill: currentColor; }
.btn.ico { padding: 0; width: 34px; height: 34px; justify-content: center; position: relative; }
.btn.back { padding: 3px 11px 3px 6px; }
.actions { flex-wrap: nowrap; }
/* tooltip: the button's own words, above it, opening rightwards: the buttons sit at the start of the row */
[data-tip]::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 0; width: max-content; max-width: 190px; white-space: normal; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 500; line-height: 1.35; padding: 5px 8px; border-radius: 6px; pointer-events: none; opacity: 0; transform: translateY(2px); transition: opacity .12s, transform .12s; z-index: 4; }
[data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; transform: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; }
.hidden-box { display: grid; gap: 6px; }
.hidden-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px dashed var(--line); border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 12px; color: var(--muted); }
.chip .btn { padding: 2px 8px; font-size: 12px; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--coral); color: var(--coral-ink); border-color: var(--coral); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); border-color: var(--coral); }
.btn.danger { color: var(--danger); }
.btn.danger.primary { background: var(--danger); border-color: var(--danger); color: var(--surface); }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 22px; color: var(--muted); text-align: center; }

/* ---------- session view: rail + detail */
.split { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 10px; max-height: calc(100vh - 32px); overflow: auto; padding-right: 2px; }
.rail .back { justify-self: start; }
.rail h3 { margin: 6px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.rail-list { display: grid; gap: 4px; }
.rail-item { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 8px; align-items: center; text-align: left; border: 1px solid transparent; background: none; border-radius: 10px; padding: 5px 7px; cursor: pointer; }
.rail-item:hover { background: var(--surface); border-color: var(--line); }
.rail-item[aria-current="page"] { background: var(--surface); border-color: var(--state-c); box-shadow: var(--shadow); }
.rail-item img { width: 34px; height: 26px; image-rendering: pixelated; grid-row: span 2; }
.rail-item .t { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-item .s { font-size: 11px; color: var(--state-c); font-variant-numeric: tabular-nums; }

.detail-main { display: grid; gap: 14px; min-width: 0; }
.dhead { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; align-items: center; box-shadow: var(--shadow); }
.dhead .crab img { width: 104px; height: 80px; }
.dhead h2 { margin: 0; font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; text-wrap: balance; }
.dhead .who { gap: 6px; }
.dhead .actions { grid-column: 1 / -1; }
.dhead .status { grid-column: 1 / -1; }
.branch { font-family: var(--mono); font-size: 12px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 14px; font-weight: 600; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--coral); }
.tab .n { font-family: var(--mono); font-weight: 500; font-size: 11px; background: var(--surface-2); border-radius: 999px; padding: 0 6px; margin-left: 6px; }
.panel { display: grid; gap: 12px; min-width: 0; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.box h3 { margin: 0; font-size: 13px; font-weight: 600; }
.prompt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 62px 80px minmax(0, 1fr); gap: 8px; padding: 6px 2px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); font-size: 13px; align-items: baseline; }
.timeline li:last-child { border-bottom: 0; }
.timeline time { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.timeline .who-k { font-size: 11px; font-weight: 600; justify-self: start; min-width: 0; max-width: 100%; }
.timeline .k-user { color: var(--coral); }
.timeline .k-text { color: var(--muted); }
.timeline .txt { overflow-wrap: anywhere; }
.timeline li.user .txt { font-weight: 500; }

/* ---------- changed files, GitHub style */
.files-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; font-size: 13px; }
.plus { color: var(--work); font-family: var(--mono); font-weight: 500; }
.minus { color: var(--danger); font-family: var(--mono); font-weight: 500; }
.files { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.file { border-top: 1px solid var(--line); }
.file:first-child { border-top: 0; }
.file-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 8px 12px; cursor: pointer; }
.file-row:hover { background: var(--surface-2); }
.file-row[aria-expanded="true"] { background: var(--surface-2); }
.fs { font-family: var(--mono); font-size: 11px; font-weight: 600; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; }
.fs-added, .fs-untracked { color: var(--work); background: var(--work-bg); }
.fs-modified { color: var(--ask); background: var(--ask-bg); }
.fs-deleted, .fs-conflict { color: var(--danger); background: var(--danger-bg); }
.fs-renamed { color: var(--lane2); background: var(--surface-2); }
.fpath { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; min-width: 0; }
.fpath .dir { color: var(--muted); }
.fpath small { font-family: var(--body); color: var(--muted); margin-left: 6px; }
.counts-f { font-family: var(--mono); font-size: 12px; display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.blocks { display: inline-flex; gap: 2px; }
.blocks i { width: 8px; height: 8px; border-radius: 1px; background: var(--surface-2); }
.blocks i.a { background: var(--work); }
.blocks i.r { background: var(--danger); }

.diff { overflow-x: auto; border-top: 1px solid var(--line); background: var(--surface); }
.diff table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
.diff td { padding: 0 8px; white-space: pre; vertical-align: top; }
.diff td.no { width: 1%; min-width: 44px; text-align: right; color: var(--muted); user-select: none; font-variant-numeric: tabular-nums; }
.diff td.sg { width: 1%; padding: 0 2px 0 6px; user-select: none; color: var(--muted); }
.diff tr.add td { background: var(--add-bg); }
.diff tr.add td.no { background: var(--add-strong); }
.diff tr.del td { background: var(--del-bg); }
.diff tr.del td.no { background: var(--del-strong); }
.diff tr.hunk td { background: var(--hunk-bg); color: var(--muted); padding-block: 3px; }
.diff .note { padding: 10px 12px; color: var(--muted); font-size: 12px; }

/* ---------- git graph */
.graph { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow-x: auto; }
.graph table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.graph td { padding: 0 10px 0 0; height: 28px; white-space: nowrap; vertical-align: middle; }
.graph td.g { padding: 0 6px 0 4px; line-height: 0; }
.graph td.subj { max-width: 560px; overflow: hidden; text-overflow: ellipsis; }
.graph tr:hover td { background: var(--surface-2); }
.graph tr.is-head td.subj { font-weight: 600; }
.graph .sha { font-family: var(--mono); color: var(--muted); font-size: 11px; }
.graph .au, .graph .tm { color: var(--muted); font-size: 12px; }
.ref { display: inline-block; font-family: var(--mono); font-size: 10.5px; border-radius: 4px; padding: 0 5px; margin-right: 4px; border: 1px solid var(--line); color: var(--muted); }
.ref.local { color: var(--ink); border-color: var(--lane1); background: var(--work-bg); }
.ref.headref { color: var(--coral-ink); background: var(--coral); border-color: var(--coral); }
.ref.tag { border-style: dashed; }

/* ---------- sheets */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .5); }
dialog::backdrop { background: rgba(8, 16, 20, .45); }
.sheet { display: grid; gap: 12px; padding: 18px; }
.sheet h2 { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); }
.sheet textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 10px; font: inherit; }
.sheet .row, .detail .row { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.detail { display: grid; gap: 12px; padding: 18px; }
.detail header { display: grid; gap: 4px; }
.detail header h2, .detail header p { margin: 0; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.kv div { background: var(--bg); border-radius: 8px; padding: 6px 9px; display: grid; }
.kv span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kv b { font-family: var(--mono); font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
.detail details pre { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; background: var(--bg); border-radius: 8px; padding: 10px; margin: 6px 0 0; max-height: 220px; overflow: auto; }
.steps { display: grid; gap: 2px; max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 6px; margin: 0; }
.steps li { list-style: none; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 5px 4px; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); font-size: 12px; }
.steps li:last-child { border-bottom: 0; }
.steps time { font-family: var(--mono); color: var(--muted); font-size: 11px; }
.steps .txt { overflow-wrap: anywhere; }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; max-width: calc(100vw - 32px); z-index: 5; }

@media (max-height: 560px) { .summary { position: static; } }
@media (max-width: 860px) {
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; grid-template-columns: minmax(0, 1fr); }
  .rail h3 { display: none; }
  .rail-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .rail-item { flex: 0 0 200px; }
  .timeline li { grid-template-columns: 52px minmax(0, 1fr); }
  .timeline .who-k { grid-column: 2; }
  .timeline .txt { grid-column: 2; }
  .dhead .crab img { width: 66px; height: 51px; }
}
@media (prefers-reduced-motion: reduce) {
  .live[data-state="live"] .dot { animation: none; }
  .bubble.pop { animation: none; }
}

function h(tag, props, ...kids) {
  const el = document.createElement(tag)

    if (k === 'class') el.className = v
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v)
    else el.setAttribute(k, v === true ? '' : String(v))

  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid))

}

    } else if (crabKind(r) !== 'waiting') {
      delete ui.done[r.id]
    }
  }
  if (finished) chime()
}
const doneSays = row => (crabKind(row) === 'waiting' ? ui.done[row.id] : undefined)
// the board is redrawn often: only a line just said pops in
function bubble(row) {
  const said = doneSays(row)
  if (!said) return null
  return h('p', { class: `bubble${Date.now() - said.at < 1500 ? ' pop' : ''}` }, said.text)
}

let audio
let lastChime = 0
function audioCtx() {
  if (audio === undefined) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)() } catch { audio = null }
  }
  return audio
}
// the page may play sound only after a gesture: the first click or key unlocks it
for (const type of ['pointerdown', 'keydown']) {
  window.addEventListener(type, () => { const c = audioCtx(); if (c?.state === 'suspended') c.resume().catch(() => {}) }, { passive: true })
}
// two soft sine notes going up, quiet
function chime() {
  const c = audioCtx()
  if (!c || Date.now() - lastChime < 2000) return
  lastChime = Date.now()
  if (c.state === 'suspended') c.resume().catch(() => {})
  const t0 = c.currentTime + 0.03
  const out = c.createGain()
  out.gain.value = 0.1
  out.connect(c.destination)
  for (const [freq, delay] of [[659.25, 0], [987.77, 0.13]]) {
    const osc = c.createOscillator()
    const env = c.createGain()
    osc.type = 'sine'
    osc.frequency.value = freq
    env.gain.setValueAtTime(0.0001, t0 + delay)
    env.gain.exponentialRampToValueAtTime(1, t0 + delay + 0.02)
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + delay + 0.9)
    osc.connect(env).connect(out)
    osc.start(t0 + delay)
    osc.stop(t0 + delay + 0.95)
  }
}

function renderLimits(snap) {
  for (const [kind, label] of [['five_hour', 'Sessione 5 ore'], ['seven_day', 'Settimana']]) {

function statusOf(row) {
  const a = row.action
  const local = ui.pending[row.id]
  if (local && (!a || a.at < local.at - 2000)) return { cls: '', text: ACTION_LABEL[local.action]?.queued || 'In coda…' }
  if (!a) return null
  if (a.status === 'error') return { cls: 'bad', text: `Non riuscita: ${a.message || 'errore sconosciuto'}` }
  if (a.status === 'expired') return { cls: 'bad', text: 'Non eseguita: la sessione non ha risposto. La mod crab-sessions è attiva lì?' }
  const text = ACTION_LABEL[a.action]?.[a.status] || a.status
  return { cls: a.status === 'done' ? 'ok' : '', text: a.status === 'done' && a.message && a.action === 'split' ? `${text}: ${a.message}` : text }
}

}

function blocks(added, removed) {
  const total = (added || 0) + (removed || 0)
  const colored = Math.min(5, total)
  const green = total ? Math.round(((added || 0) / total) * colored) : 0
  return h('span', { class: 'blocks', 'aria-hidden': 'true' },
    Array.from({ length: 5 }, (_, i) => h('i', { class: i < green ? 'a' : i < colored ? 'r' : '' })))
}

const fileKey = f => `${f.path}|${f.status}|${f.added}|${f.removed}`

function diffView(f) {
  const entry = ui.diffs.get(f.path)
  if (!entry || entry.loading) return h('div', { class: 'diff' }, h('div', { class: 'note' }, 'Carico il diff…'))
  if (entry.error) return h('div', { class: 'diff' }, h('div', { class: 'note' }, entry.error))
  const d = entry.data
  if (d.isBinary) return h('div', { class: 'diff' }, h('div', { class: 'note' }, 'File binario: nessun diff da mostrare.'))
  if (d.hunks.length === 0) return h('div', { class: 'diff' }, h('div', { class: 'note' }, f.status === 'renamed' ? 'Solo rinominato, contenuto uguale.' : 'Nessuna riga cambiata.'))
  const rows = []
  for (const hunk of d.hunks) {
    rows.push(h('tr', { class: 'hunk' }, h('td', { class: 'no' }), h('td', { class: 'no' }), h('td', { colspan: 2 }, hunk.header)))
    for (const l of hunk.lines) {
      rows.push(h('tr', { class: l.kind },
        h('td', { class: 'no' }, l.old ?? ''),
        h('td', { class: 'no' }, l.new ?? ''),
        h('td', { class: 'sg' }, l.kind === 'add' ? '+' : l.kind === 'del' ? '−' : ' '),
        h('td', null, l.text),
      ))
    }
  }
  return h('div', { class: 'diff' },
    h('table', null, h('tbody', null, rows)),
    d.isTruncated ? h('div', { class: 'note' }, 'Diff troppo lungo: mostro solo l’inizio.') : null,
  )
}

function changesPanel(row, detail) {
  if (!detail) return [h('p', { class: 'sub' }, 'Carico le modifiche…')]
  if (!detail.git) {
    return [h('div', { class: 'empty' }, detail.gitError ? `Git non risponde: ${detail.gitError}` : 'La cartella di questa sessione non è un repository git.')]
  }
  const g = detail.git
  if (g.files.length === 0) return [h('div', { class: 'empty' }, `Nessuna modifica rispetto all’ultimo commit${g.head ? ` (${g.head})` : ''}.`)]
  const files = g.files.map(f => {
    const [letter, label] = FILE_STATUS[f.status] || ['?', f.status]
    const open = ui.openFiles.has(f.path)
    const cut = f.path.lastIndexOf('/')
    const dir = cut >= 0 ? f.path.slice(0, cut + 1) : ''
    const base = f.path.slice(cut + 1)
    return h('div', { class: 'file' },
      h('button', {
        class: 'file-row', type: 'button', 'aria-expanded': String(open), 'data-focus': `file:${f.path}`, title: label,
        onclick: () => toggleFile(row, f),
      },
        h('span', { class: `fs fs-${f.status}`, 'aria-label': label }, letter),
        h('span', { class: 'fpath' },
          f.oldPath ? h('span', { class: 'dir' }, `${f.oldPath} → `) : null,
          h('span', { class: 'dir' }, dir), base,
          f.status === 'untracked' ? h('small', null, 'nuovo') : null,
        ),
        h('span', { class: 'counts-f' },
          f.added === null ? h('span', { class: 'sub' }, 'binario') : [
            h('span', { class: 'plus' }, `+${num(f.added)}`),
            h('span', { class: 'minus' }, `−${num(f.removed || 0)}`),
          ]),
        blocks(f.added, f.removed),
      ),
      open ? diffView(f) : null,
    )
  })
  return [
    h('div', { class: 'files-head' },
      h('strong', null, `${num(g.totals.files)} ${g.totals.files === 1 ? 'file modificato' : 'file modificati'}`),
      h('span', { class: 'plus' }, `+${num(g.totals.added)}`),
      h('span', { class: 'minus' }, `−${num(g.totals.removed)}`),
      h('span', { class: 'sub' }, `rispetto a ${g.head ?? 'nessun commit'}${g.branch ? ` su ${g.branch}` : ''}`),
      g.isTruncated ? h('span', { class: 'sub' }, '· mostro i primi 500') : null,
    ),
    h('div', { class: 'files' }, files),
  ]
}

function refBadge(ref) {
  if (ref.startsWith('HEAD -> ')) return h('span', { class: 'ref headref' }, ref.slice(8))
  if (ref === 'HEAD') return h('span', { class: 'ref headref' }, 'HEAD')
  if (ref.startsWith('tag: ')) return h('span', { class: 'ref tag' }, ref.slice(5))
  return h('span', { class: `ref${ref.includes('/') ? '' : ' local'}` }, ref)
}

const LANE_W = 14
const ROW_H = 28
function graphCell(row, lanes) {
  const width = lanes * LANE_W + 6
  const svg = svgEl('svg', { width, height: ROW_H, viewBox: `0 0 ${width} ${ROW_H}`, 'aria-hidden': 'true' })
  const x = lane => lane * LANE_W + LANE_W / 2
  for (const s of row.segments) {
    const x1 = x(s.x1), y1 = s.y1 * ROW_H, x2 = x(s.x2), y2 = s.y2 * ROW_H
    const ym = (y1 + y2) / 2
    const d = x1 === x2 ? `M${x1} ${y1}L${x2} ${y2}` : `M${x1} ${y1}C${x1} ${ym} ${x2} ${ym} ${x2} ${y2}`
    svg.append(svgEl('path', { d, fill: 'none', stroke: `var(--lane${s.lane % 6})`, 'stroke-width': 2, 'stroke-linecap': 'round' }))
  }
  const cx = x(row.col)
  if (row.isHead) svg.append(svgEl('circle', { cx, cy: ROW_H / 2, r: 6.5, fill: 'var(--surface)', stroke: 'var(--coral)', 'stroke-width': 2 }))
  svg.append(svgEl('circle', { cx, cy: ROW_H / 2, r: 4, fill: `var(--lane${row.col % 6})`, stroke: 'var(--surface)', 'stroke-width': 1.5 }))
  return svg
}

function graphPanel(row, detail) {
  if (detail && !detail.git) return [h('div', { class: 'empty' }, 'La cartella di questa sessione non è un repository git.')]
  const gr = ui.graph
  const bar = h('div', { class: 'files-head' },
    h('strong', null, 'Commit di tutti i rami'),
    gr?.data ? h('span', { class: 'sub' }, `${gr.data.rows.length} più recenti`) : null,
    h('button', { class: 'btn', type: 'button', 'data-focus': 'graph:refresh', onclick: () => loadGraph(true) }, 'Aggiorna'),
  )
  if (!gr || gr.loading) return [bar, h('p', { class: 'sub' }, 'Carico il grafo…')]
  if (gr.error) return [bar, h('div', { class: 'empty' }, gr.error)]
  const now = Date.now()
  return [bar, h('div', { class: 'graph' }, h('table', null, h('tbody', null, gr.data.rows.map(c =>
    h('tr', { class: c.isHead ? 'is-head' : '' },
      h('td', { class: 'g' }, graphCell(c, gr.data.lanes)),
      h('td', { class: 'subj', title: c.subject }, c.refs.map(refBadge), c.subject),
      h('td', { class: 'au' }, c.author),
      h('td', { class: 'tm', title: shortDate(c.time) }, now - c.time < 7 * 86400e3 ? `${ago(now - c.time)} fa` : shortDate(c.time)),
      h('td', { class: 'sha' }, c.short),
    ),
  ))))]
}

function sessionView(snap, now) {
  const rows = snap?.rows || []
  const row = rows.find(r => r.id === ui.focus)
  const detail = snap?.detail?.id === ui.focus ? snap.detail : undefined
  let main
  if (!snap) {
    main = [h('p', { class: 'sub' }, 'Collegamento…')]
  } else if (!row) {
    main = [h('div', { class: 'empty' }, 'Questa sessione non è più aperta.'), h('button', { class: 'btn', type: 'button', onclick: () => go(null) }, '← Dashboard')]
  } else {
    const panel = ui.tab === 'changes' ? changesPanel(row, detail) : ui.tab === 'graph' ? graphPanel(row, detail) : runPanel(row, detail, now)
    main = [
      detailHead(row, detail, now),
      tabsBar(detail),
      h('div', { class: 'panel', id: 'tabpanel', role: 'tabpanel', 'aria-labelledby': `tab-${ui.tab}` }, panel),
    ]

  return [h('div', { class: 'split' }, railView(rows, now), h('div', { class: 'detail-main' }, main))]
}

function togglePopover(id) {

// Rebuilt with each update, so its agents stay live; the box itself stays, and so does its scroll.
function renderPopover(snap, now) {
  const pop = document.getElementById('agentPop')
  const row = !ui.focus && ui.popover ? snap?.rows?.find(r => r.id === ui.popover) : undefined
  if (!row || !(row.agents || []).length) {
    ui.popover = null
    pop.hidden = true
    pop.replaceChildren()
    return
  }
  const agents = row.agents
  const running = agents.filter(a => a.running).length
  const scroll = pop.scrollTop
  pop.replaceChildren(
    h('header', null,
      h('h3', null, row.title),
      h('span', { class: 'sub' }, running > 0 ? `${running} al lavoro · ${agents.length} recenti` : `${agents.length} recenti, nessuno al lavoro`),
      h('button', { class: 'close', type: 'button', 'aria-label': 'Chiudi', 'data-focus': 'pop:close', onclick: () => closePopover({ refocus: true }) }, '×'),
    ),
    ...agents.map(a => agentRow(row, a, now)),
  )
  pop.hidden = false
  pop.scrollTop = scroll
  placePopover()
}

// Beside the card, on the side with room; below or above it on a narrow screen; always on screen.
function placePopover() {
  const pop = document.getElementById('agentPop')
  if (pop.hidden || !ui.popover) return
  const card = document.querySelector(`[data-card="${CSS.escape(ui.popover)}"]`)
  if (!card) return
  const r = card.getBoundingClientRect()
  const vw = document.documentElement.clientWidth
  const vh = window.innerHeight
  const m = 16
  const gap = 10
  const w = pop.offsetWidth
  const ph = pop.offsetHeight
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, hi))
  let left
  let top
  if (r.right + gap + w <= vw - m) {
    left = r.right + gap
    top = r.top
  } else if (r.left - gap - w >= m) {
    left = r.left - gap - w
    top = r.top
  } else {
    left = r.left
    top = r.bottom + gap + ph <= vh - m || r.top - gap - ph < m ? r.bottom + gap : r.top - gap - ph
  }
  pop.style.left = `${clamp(left, m, vw - m - w)}px`
  pop.style.top = `${clamp(top, m, Math.max(m, vh - m - ph))}px`
}

window.addEventListener('resize', placePopover)
window.addEventListener('scroll', placePopover, { capture: true, passive: true })
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.popover && !document.querySelector('dialog[open]')) closePopover({ refocus: true }) })
// a click elsewhere closes it; not one in the popover, on its own toggle, or in the agent's dialog it opened
document.addEventListener('pointerdown', e => {
  if (!ui.popover || !(e.target instanceof Element)) return
  if (e.target.closest('#agentPop, [data-pop-toggle], dialog')) return
  closePopover()
})

// ---------------------------------------------------------------- live data

async function startLoop() {
  if (ui.loopRunning || !mcp) return
  ui.loopRunning = true
  let failures = 0
  try {
    for (;;) {
      if (document.hidden) await new Promise(r => document.addEventListener('visibilitychange', r, { once: true }))
      const started = Date.now()
      const focus = ui.focus
      const ctrl = new AbortController()
      ui.wake = () => ctrl.abort()
      try {
        const input = { since: ui.snap?.focus === focus ? ui.snap?.version : undefined, have: Object.keys(ui.sprites) }
        if (focus) input.focus = focus
        const res = await mcp.callTool(SERVER, 'sessions_watch', input, { cache: false, signal: ctrl.signal })
        const p = res.payload
        if (!p || !Array.isArray(p.rows)) throw { code: 'upstream_error', message: 'Risposta del server non valida' }
        Object.assign(ui.sprites, p.sprites || {})
        for (const r of p.rows) if (ui.pending[r.id] && r.action && r.action.at >= ui.pending[r.id].at - 2000) delete ui.pending[r.id]
        p.focus = focus
        ui.snap = p
        ui.lastOk = Date.now()
        ui.conn = 'live'
        failures = 0
        showNotice(null)
        afterSnapshot(p)
        render()
      } catch (err) {
        // our own abort: the person opened another session, ask again right away
        if (ctrl.signal.aborted) { await sleep(300); continue }
        const code = err?.code
        if (code === 'server_not_connected' || code === 'server_not_found') {
          ui.conn = 'offline'; render(); showNotice('offline'); return
        }
        if (['not_in_manifest', 'not_granted', 'capability_disabled', 'capability_removed', 'blocked_by_policy', 'approval_required', 'cancelled'].includes(code)) {
          ui.conn = 'denied'; render(); showNotice('denied'); return
        }
        failures++
        ui.conn = 'retrying'
        render()
        const wait = err?.retryable && err?.retryAfterMs ? err.retryAfterMs : Math.min(30000, 2000 * 2 ** Math.min(failures, 4))
        await sleep(wait + Math.random() * 800)
        continue
      } finally {
        ui.wake = null
      }
      const gap = MIN_GAP_MS - (Date.now() - started)
      if (gap > 0) {
        // a switch to another session cuts the wait short
        await new Promise(resolve => { const t = setTimeout(resolve, gap); ui.wake = () => { clearTimeout(t); resolve() } })
        ui.wake = null
      }
    }
  } finally {
    ui.loopRunning = false
  }
}

// Open diffs follow their file: one whose line counts changed is read again.
function afterSnapshot(p) {
  noteFinished(p.rows)
  const files = p.detail?.id === ui.focus ? p.detail?.git?.files || [] : []
  for (const path of [...ui.openFiles]) {
    const f = files.find(x => x.path === path)
    if (!f) { ui.openFiles.delete(path); ui.diffs.delete(path); continue }
    const entry = ui.diffs.get(path)
    if (entry && !entry.loading && entry.key !== fileKey(f)) loadDiff(p.rows.find(r => r.id === ui.focus), f)
  }
  if (ui.tab === 'graph' && ui.graph?.data && p.detail?.git && ui.graph.head !== p.detail.git.head) loadGraph(true)
}

function errorText(err) {
  if (err?.code === 'cancelled') return 'Annullato.'
  if (err?.code === 'approval_required') return 'Serve la tua approvazione per questa azione.'
  if (err?.code === 'server_not_connected') return 'Il server locale non risponde.'
  return err?.message || 'Qualcosa non ha funzionato.'
}

function toggleFile(row, f) {
  if (ui.openFiles.has(f.path)) { ui.openFiles.delete(f.path); render(); return }
  ui.openFiles.add(f.path)
  if (ui.diffs.get(f.path)?.key !== fileKey(f)) loadDiff(row, f)
  render()
}

async function loadDiff(row, f) {
  if (!mcp || !row) return
  const key = fileKey(f)
  ui.diffs.set(f.path, { key, loading: true })
  render()
  try {
    const res = await mcp.callTool(SERVER, 'session_diff', { sessionId: row.id, path: f.path }, { cache: false })
    if (ui.diffs.get(f.path)?.key === key) ui.diffs.set(f.path, { key, data: res.payload })
  } catch (err) {
    if (ui.diffs.get(f.path)?.key === key) ui.diffs.set(f.path, { key, error: errorText(err) })
  }
  render()
}

async function loadGraph(isRefresh) {
  const id = ui.focus
  if (!mcp || !id || (ui.graph && !isRefresh && (ui.graph.loading || ui.graph.data))) return
  const head = ui.snap?.detail?.git?.head ?? null
  ui.graph = { ...(ui.graph || {}), loading: !ui.graph?.data }
  render()
  try {
    const res = await mcp.callTool(SERVER, 'git_graph', { sessionId: id }, { cache: false })
    if (ui.focus === id) ui.graph = { data: res.payload, head }
  } catch (err) {
    if (ui.focus === id) ui.graph = { error: errorText(err), head }
  }
  render()
}

async function openSession(row) {
  if (!mcp || row.example) return
  try {
    await mcp.callTool(SERVER, 'session_open', { sessionId: row.id }, { cache: false })
    toast(`Apro «${row.title}» nell’app`)
  } catch (err) {
    toast(errorText(err))
  }
}

async function runAction(row, action, prompt) {
  ui.pending[row.id] = { action, at: Date.now() }
  render()
  try {
    const res = await mcp.callTool(SERVER, 'session_action', { sessionId: row.id, action, ...(prompt ? { prompt } : {}) }, { cache: false })
    if (res.payload?.started) { delete ui.pending[row.id]; toast('Copia avviata in una nuova finestra del Terminale.') }
  } catch (err) {
    delete ui.pending[row.id]
    toast(errorText(err))
  }
  render()
}

async function hideSession(row) {
  if (!mcp || row.example) return
  try {
    await mcp.callTool(SERVER, 'session_action', { sessionId: row.id, action: 'hide' }, { cache: false })
    if (ui.focus === row.id) go(null)
    toast(`«${row.title}» nascosta: la ritrovi in fondo alla dashboard.`)
  } catch (err) {
    toast(errorText(err))
  }
}

async function unhideSession(x) {

;(async () => {
  if (!window.claude?.use) { ui.conn = 'nohost'; render(); showNotice('nohost'); return }

  if (!mcp) { ui.conn = 'nohost'; render(); showNotice('nohost'); return }
  startLoop()
})()
</script>
